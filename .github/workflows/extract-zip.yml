name: Extract Project Zip

on:
  push:
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip every zip in the repo root (flatten a single wrapper folder)
        run: |
          shopt -s nullglob
          for f in *.zip; do
            echo "Extracting: $f"
            tmp=$(mktemp -d)
            unzip -o -q "$f" -d "$tmp"
            count=$(ls -A "$tmp" | wc -l)
            first=$(ls -A "$tmp" | head -n 1)
            if [ "$count" -eq 1 ] && [ -d "$tmp/$first" ]; then
              cp -r "$tmp/$first"/. .
            else
              cp -r "$tmp"/. .
            fi
            rm -rf "$tmp"
          done
          rm -f *.zip

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-extract project zip"
          git push
